<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>팀장 첫번째 커밋</h1>
        <h1>은솔 두번째 커밋</h1>
        <h1>진엽 세번째 커밋</h1>
        <h1>정익 네번째 커밋</h1>
        <h1>은혜 다섯번째 커밋</h1>
        <h1>민성 여섯번째 커밋</h1>
    </div>
    <div></div>
    
    <footer class="field">
    <!-- I: 전체가 맨 아래줄 -->
    <div class="piece piece-i">
      <span class="cell-bottom"></span>
      <span class="cell-bottom"></span>
      <span class="cell-bottom"></span>
      <span class="cell-bottom"></span>
    </div>

    <!-- O: 위 2칸 keep, 아래 2칸 bottom -->
    <div class="piece piece-o">
      <span class="cell-keep"></span>
      <span class="cell-keep"></span>
      <span class="cell-bottom"></span>
      <span class="cell-bottom"></span>
    </div>

    <!-- L: 위 2칸 keep, 아래 2칸 bottom -->
    <div class="piece piece-l">
      <span class="cell-keep"></span>
      <span class="cell-keep"></span>
      <span class="cell-bottom"></span>
      <span class="cell-bottom"></span>
    </div>
  </footer>
</body>
</html>
