<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div>
    <h1>팀장 첫번째 커밋</h1>
    <h1>은솔 두번째 커밋</h1>
    <h1>진엽 세번째 커밋</h1>
    <h1>정익 네번째 커밋</h1>
    <h1>은혜 다섯번째 커밋</h1>
    <h1>민성 여섯번째 커밋</h1>
  </div>

  <footer class="footer-bar">

    <div class="side-panel score-panel">
      <span class="panel-label">SCORE</span>
      <span class="panel-value"></span>
    </div>

    <div class="field">
      <div class="piece piece-i">
        <span class="cell-bottom"></span>
        <span class="cell-bottom"></span>
        <span class="cell-bottom"></span>
        <span class="cell-bottom"></span>
      </div>

      <div class="piece piece-o">
        <span class="cell-keep"></span>
        <span class="cell-keep"></span>
        <span class="cell-bottom"></span>
        <span class="cell-bottom"></span>
      </div>

      <div class="piece piece-l">
        <span class="cell-keep"></span>
        <span class="cell-keep"></span>
        <span class="cell-bottom"></span>
        <span class="cell-bottom"></span>
      </div>
    </div>

    <div class="side-panel next-hold">
      <div class="mini-box">
        <span class="panel-label">NEXT</span>
        <div class="mini-piece mini-t">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="mini-box">
        <span class="panel-label">HOLD</span>
        <div class="mini-piece empty"></div>
      </div>
    </div>

  </footer>
</body>

</html>
